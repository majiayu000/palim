[package]
name = "palim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reversible JSON structural diffs with array moves and interoperable deltas"
license = "MIT"
readme = "README.md"
repository = "https://github.com/majiayu000/palim"
exclude = ["results", "tools", "node_modules", "fuzz"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }
num-bigint = "0.4.6"
imara-diff = { version = "0.2.0", default-features = false }
json-patch = "4.2.0"
percent-encoding = "2.3"

[dev-dependencies]
proptest = "1.9"
criterion = "0.7"

[[bench]]
name = "core"
harness = false
